[platformio]
default_envs = robomaster_c

[env:robomaster_c]
platform = ststm32
board = nucleo_f405rg
framework = stm32cube

; Build options
build_flags =
    -DSTM32F405xx
    -D_USE_LEGACY_HAL
    -Iinclude
    -I../config

; Debug options
debug_tool = stlink
debug_speed = 5000

; Monitor options
monitor_speed = 115200

; Upload options
upload_protocol = stlink
upload_speed = 5000

; Library dependencies
lib_deps =
    ; Add required libraries here
    ; Example: STM32CubeMX generated code

; Additional options
extra_scripts =
    pre:extra_script.py

; Optimization
build_unflags = -Os
build_flags = ${env.build_flags} -O2
